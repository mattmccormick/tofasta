[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tofasta"
version = "0.1.0"
description = "Convert pandas DataFrames and CSV files to FASTA, with validation that refuses to write malformed output."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matt McCormick", email = "matt@mattmccormick.ca" }]
keywords = ["fasta", "bioinformatics", "pandas", "csv", "sequence", "genomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = ["pandas>=1.5"]

# Docs live here rather than in [dependency-groups] because Read the Docs
# installs them through pip's extras mechanism, which does not understand
# PEP 735 groups.
[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "furo>=2024.1.29",
    "myst-parser>=2.0",
    "sphinx-argparse>=0.4",
]

[project.urls]
Homepage = "https://github.com/mattmccormick/tofasta"
Documentation = "https://tofasta.readthedocs.io"
Issues = "https://github.com/mattmccormick/tofasta/issues"

[project.scripts]
tofasta = "tofasta._cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/tofasta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
